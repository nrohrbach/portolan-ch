# portolan-ch: STAC-Quellen
# Füge neue Datenhalter hier hinzu — das Script generiert alles andere automatisch.

publishers:

 

  - id: kanton-bern
    title: "Kanton Bern — Amt für Geoinformation"
    description: "Geodata from the Canton of Bern, published by the Amt für Geoinformation (AGI). Static STAC catalog including GeoParquet assets for many products."
    type: static_catalog
    endpoint: "https://geofiles.be.ch/geoportal/pub/stac/de/catalog.json"
    pagination: none
    auth: none

  - id: kanton-luzern
    title: "Kanton Luzern — Geoinformation"
    description: "Geodata from the Canton of Lucerne. Public OGD products are freely accessible without authentication. Restricted products (cadastral survey, utility networks) are excluded."
    type: stac_api
    endpoint: "https://daten.geo.lu.ch/api/stac/v1.0/"
    collections_path: "collections"
    pagination: offset
    filter:
      exclude_auth: true
    auth: none

  - id: kanton-basel-stadt
    title: "Kanton Basel-Stadt — Geodaten"
    description: "Geodata from the Canton of Basel-Stadt. Collections cover planning, environment, transport, health, and society. Download requires OIDC authentication (contact geo@bs.ch)."
    type: stac_api
    endpoint: "https://api.geo.bs.ch/stac/v1/"
    collections_path: "collections"
    pagination: offset
    auth: none
